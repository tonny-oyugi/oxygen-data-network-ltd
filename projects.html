<body>

<!-- FULLSCREEN MEDIA MODAL -->
<div id="mediaModal" class="media-modal" onclick="handleBackdrop(event)">
    <span class="media-close" onclick="closeModal()">×</span>

    <button class="media-nav left" onclick="prevMedia()">‹</button>
    <button class="media-nav right" onclick="nextMedia()">›</button>

    <div class="media-content" id="mediaContent"></div>
</div>

<script>
function resetGallery(btn){
    const gallery = btn.nextElementSibling.querySelector('.horizontal-gallery');
    gallery.scrollTo({left:0,behavior:'smooth'});
}

/* ===== FULLSCREEN VIEWER (FINAL, STABLE) ===== */

let mediaItems = [];
let currentIndex = 0;
let startX = null;

window.addEventListener('load', () => {
    mediaItems = Array.from(document.querySelectorAll('.media-card img, .media-card video'));

    mediaItems.forEach((item, index) => {
        item.addEventListener('click', e => {
            e.stopPropagation();
            openModal(index);
        });
    });
});

function openModal(index) {
    currentIndex = index;

    const modal = document.getElementById('mediaModal');
    const content = document.getElementById('mediaContent');

    cleanupModal();
    document.body.style.overflow = 'hidden';

    const original = mediaItems[index];
    let media;

    if (original.tagName === 'VIDEO') {
        media = original.cloneNode(true);
        media.controls = true;
        media.muted = false;
        media.playsInline = true;
        media.currentTime = 0;
        media.play();
    } else {
        media = document.createElement('img');
        media.src = original.src;
    }

    media.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
    });

    media.addEventListener('touchend', e => {
        if (startX === null) return;
        const diff = e.changedTouches[0].clientX - startX;
        if (diff > 60) prevMedia();
        if (diff < -60) nextMedia();
        startX = null;
    });

    content.appendChild(media);
    modal.classList.add('active');
}

function closeModal() {
    cleanupModal();
    document.body.style.overflow = '';
}

function cleanupModal() {
    const modal = document.getElementById('mediaModal');
    const content = document.getElementById('mediaContent');

    const video = content.querySelector('video');
    if (video) {
        video.pause();
        video.src = '';
    }

    content.innerHTML = '';
    modal.classList.remove('active');
}

function nextMedia() {
    currentIndex = (currentIndex + 1) % mediaItems.length;
    openModal(currentIndex);
}

function prevMedia() {
    currentIndex = (currentIndex - 1 + mediaItems.length) % mediaItems.length;
    openModal(currentIndex);
}

function handleBackdrop(e) {
    if (e.target.id === 'mediaModal') {
        closeModal();
    }
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowRight') nextMedia();
    if (e.key === 'ArrowLeft') prevMedia();
});
</script>

</body>
</html>
