<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects | Oxygen Data Network Ltd</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>Our Projects</h1>
<p>Ongoing and Completed Works</p>
</header>

<a href="index.html" class="back-link">← Back to Home</a>

<main>

<section>
<h2>Ongoing Projects</h2>
<p>Selected ongoing drilling, blasting, and compressor-based operations.</p>

<button class="gallery-reset" onclick="resetGallery(this)">⟲ Back to Start</button>

<div class="gallery-wrapper">

<button class="gallery-btn left"
onclick="this.nextElementSibling.scrollBy({left:-320,behavior:'smooth'})">‹</button>

<div class="horizontal-gallery">

<div class="media-card">
<img src="Team at work.jpeg" loading="lazy">
</div>

<div class="media-card">
<img src="Compressor on Site.jpeg" loading="lazy">
</div>

<div class="media-card video">
<video src="project 9.mp4" controls muted playsinline preload="none"></video>
</div>

</div>

<button class="gallery-btn right"
onclick="this.previousElementSibling.scrollBy({left:320,behavior:'smooth'})">›</button>

</div>
</section>

<section>
<h2>Completed Projects</h2>
<p>Selected completed works delivered in line with safety and quality standards.</p>

<button class="gallery-reset" onclick="resetGallery(this)">⟲ Back to Start</button>

<div class="gallery-wrapper">

<button class="gallery-btn left"
onclick="this.nextElementSibling.scrollBy({left:-320,behavior:'smooth'})">‹</button>

<div class="horizontal-gallery">

<div class="media-card">
<img src="Blasting Aftermath at Ziwa Sirikwa.jpeg" loading="lazy">
</div>

</div>

<button class="gallery-btn right"
onclick="this.previousElementSibling.scrollBy({left:320,behavior:'smooth'})">›</button>

</div>
</section>

</main>

<footer>
<p>© 2026 Oxygen Data Network Ltd</p>
</footer>

<script>
function resetGallery(btn){
    const gallery = btn.nextElementSibling.querySelector('.horizontal-gallery');
    gallery.scrollTo({left:0,behavior:'smooth'});
}

const observer = new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(!e.isIntersecting && !e.target.paused){ e.target.pause(); }
});
},{threshold:0.5});

document.querySelectorAll('video').forEach(v=>observer.observe(v));
</script>

<!-- FULLSCREEN MEDIA MODAL -->
<div id="mediaModal" class="media-modal">
    <span class="media-close" onclick="closeModal()">×</span>

    <button class="media-nav left" onclick="prevMedia()">‹</button>
    <button class="media-nav right" onclick="nextMedia()">›</button>

    <div class="media-content" id="mediaContent"></div>
</div>

<script>
let mediaItems = [];
let currentIndex = 0;
let startX = 0;

function initMediaViewer() {
    mediaItems = Array.from(document.querySelectorAll('.media-card img, .media-card video'));

    mediaItems.forEach((item, index) => {
        item.addEventListener('click', () => openModal(index));
    });
}

function openModal(index) {
    currentIndex = index;
    const modal = document.getElementById('mediaModal');
    const content = document.getElementById('mediaContent');

    content.innerHTML = '';
    document.body.style.overflow = 'hidden';

    const original = mediaItems[index];
    let clone;

    if (original.tagName === 'VIDEO') {
        clone = original.cloneNode(true);
        clone.controls = true;
        clone.muted = false;
        clone.playsInline = true;
        clone.play();
    } else {
        clone = document.createElement('img');
        clone.src = original.src;
    }

    clone.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
    });

    clone.addEventListener('touchend', e => {
        const endX = e.changedTouches[0].clientX;
        if (endX - startX > 50) prevMedia();
        if (startX - endX > 50) nextMedia();
    });

    content.appendChild(clone);
    modal.classList.add('active');
}

function closeModal() {
    const modal = document.getElementById('mediaModal');
    modal.classList.remove('active');
    document.getElementById('mediaContent').innerHTML = '';
    document.body.style.overflow = '';
}

function nextMedia() {
    currentIndex = (currentIndex + 1) % mediaItems.length;
    openModal(currentIndex);
}

function prevMedia() {
    currentIndex = (currentIndex - 1 + mediaItems.length) % mediaItems.length;
    openModal(currentIndex);
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowRight') nextMedia();
    if (e.key === 'ArrowLeft') prevMedia();
});

window.addEventListener('load', initMediaViewer);
</script>


</body>
</html>
